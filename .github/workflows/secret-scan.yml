name: Secret scan

# Defense in depth for the exact class of accident this repo already had once
# (a stray binary and push scripts that were gitignored, not repo-scanned).
# Runs on every push and PR so a future leaked key/token/credential is caught
# by CI even if someone's local pre-commit hook isn't installed or is bypassed.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
